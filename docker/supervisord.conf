; Supervision du rôle « web » : nginx et php-fpm dans le même conteneur.
;
; Deux processus pour un conteneur, c'est un choix assumé : nginx et php-fpm
; parlent par une socket locale, les séparer imposerait de partager le code
; entre deux images ou par un volume, pour aucun gain d'exploitation. Les
; autres rôles (queue, schedule) n'ont, eux, qu'un seul processus.
[supervisord]
nodaemon = true
user = root
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; Si php-fpm meurt, la moindre requête PHP renvoie 502 : le conteneur doit
; tomber pour que l'orchestrateur le remplace, plutôt que servir des erreurs.
startretries = 3

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
startretries = 3

[eventlistener:arret]
; Un processus mort et non relancé fait sortir supervisord, donc le conteneur.
command = sh -c 'printf "READY\n"; while read line; do kill -SIGQUIT $PPID; done'
events = PROCESS_STATE_FATAL
