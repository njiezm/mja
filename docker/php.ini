; Réglages PHP de l'image MJA.
; Chargé en dernier (zz-) pour primer sur les valeurs par défaut de l'image.

; ── Mémoire et temps ────────────────────────────────────────────────
; Les vignettes de partage et les cartons vidéo sont composés en mémoire avec
; gd, sur des images de 4000 px de côté : 128 Mo ne suffisent pas.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; ── Envois de fichiers ──────────────────────────────────────────────
; Aligné sur client_max_body_size de nginx. Au-delà de vingt fichiers, un
; dépôt multiple de photos est tronqué sans message d'erreur.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 40

; ── Journaux ────────────────────────────────────────────────────────
; Rien à l'écran : une erreur PHP affichée dans une page publique fuite des
; chemins et des extraits de code. Tout part sur la sortie d'erreur, que le
; conteneur collecte.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Sessions ────────────────────────────────────────────────────────
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; ── OPcache ─────────────────────────────────────────────────────────
; Le code est figé dans l'image : inutile de vérifier les dates de
; modification à chaque requête.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; ── Divers ──────────────────────────────────────────────────────────
expose_php = Off
date.timezone = America/Martinique
