; Pool php-fpm de l'image MJA.
; L'image de base écoute déjà sur 9000 ; on ne redéfinit que ce qui compte.
[www]
user  = www-data
group = www-data
listen = 127.0.0.1:9000

; Processus dynamiques : le trafic du site est très irrégulier (pics lors des
; campagnes d'adhésion, quasi rien entre deux).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recyclage régulier : borne l'effet d'une fuite mémoire dans une extension.
pm.max_requests = 500

; Les journaux du worker remontent au conteneur.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Ping interne pour le HEALTHCHECK et les sondes d'orchestrateur.
ping.path = /fpm-ping
