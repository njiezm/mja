# nginx pour l'application MJA : un seul vhost, php-fpm en local.
user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Journaux sur la sortie standard : c'est le collecteur de logs du
    # conteneur qui les ramasse, pas un fichier qui grossit sans surveillance.
    access_log /dev/stdout;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # Le kit de communication sert des vidéos de plusieurs dizaines de Mo et
    # l'espace membre accepte des pièces jointes : la limite doit suivre
    # celle de PHP, sinon nginx refuse avant même d'atteindre l'application.
    client_max_body_size 64m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml font/woff2;

    server {
        listen      80 default_server;
        server_name _;
        root        /var/www/html/public;
        index       index.php;

        charset utf-8;

        # Le proxy en amont termine le HTTPS ; Laravel fait déjà confiance à
        # X-Forwarded-Proto (voir bootstrap/app.php).
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Assets versionnés par Vite : le nom porte l'empreinte, on peut
        # cacher sans limite.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Médias du site et du kit : lourds, immuables en pratique.
        location ~* ^/(images|videos|fonts)/ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Rien d'exécutable en dehors du point d'entrée : un .php déposé dans
        # storage ou dans un dossier d'upload ne doit jamais être interprété.
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;

            # Les commandes de génération (vignettes, montages) peuvent être
            # déclenchées depuis l'administration : elles prennent du temps.
            fastcgi_read_timeout 300;
            fastcgi_buffers      16 16k;
            fastcgi_buffer_size  32k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
